# =============================================================================
# DMDD — Data Migration Design Document Template (HH variant)
# =============================================================================
# This YAML is the machine-readable equivalent of a DMDD spreadsheet.
# It is the source of truth for data migration mappings.
# Agents read/write this file; humans may also edit the companion .xlsx.

summary:
  vendor: ""              # e.g. "IQGeo"
  customer: ""            # e.g. "Acme Telecom"
  date: ""                # ISO date, e.g. "2026-03-12"
  instructions:
    - "Summary and use instructions for this workbook."
    - "The intention of this Workbook is to have Object, Attribute, and Value level mappings reviewed for the data migration project."
  status_values:          # Allowed status values used in tracking columns
    - Pending Review
    - Pending Comment Resolution
    - Remove
    - Approved - Attribute
    - Approved - Mapping

# -----------------------------------------------------------------------------
# Object Inventory — one entry per source object/feature class (populated by profile stage)
# -----------------------------------------------------------------------------
object_inventory:
  - feature: ""           # Source feature class name, e.g. "RISER", "MANHOLE"
    count: 0              # Row count in source data
    include_in_mapping: "" # "Yes" | "No"

# -----------------------------------------------------------------------------
# Attribute Inventory — one entry per source attribute (populated by profile stage)
# -----------------------------------------------------------------------------
attribute_inventory:
  - feature: ""           # Parent source feature class
    attribute: ""         # Source attribute/column name
    data_type: ""         # e.g. "fme_uint32", "varchar(255)", "geometry"
    count_null: 0         # Number of NULL values
    count_unique: 0       # Number of distinct values
    include_in_mapping: "" # "Yes" | "No"

# -----------------------------------------------------------------------------
# Object Mapping — target-first: IQGeo feature ← source (populated by plan stage)
# Each entry maps one IQGeo target feature to its source(s).
# -----------------------------------------------------------------------------
object_mapping:
  - tracking:
      update_person: ""       # Who last modified this row
      update_date: ""         # ISO date
      review_comments: ""
      status: ""              # One of status_values above
      jira_ticket: ""
    iqgeo_features:
      feature: ""             # IQGeo feature category, e.g. "Building", "Chamber", "Pole"
      display_name: ""
      internal_name: ""       # e.g. "building", "chamber", "pole"
      editable: ""            # "Y" | "N"
      layer: ""
      specifications: ""      # e.g. "chamber_spec", "pole_spec"
      feature_type: ""        # e.g. "structure", "route", "cable", "equipment"
      function: ""
      housing: ""
      style: ""
    source_mapping:
      system: ""              # Source system name, e.g. "GCOM", "3GIS"
      table_layer: ""         # Source table/layer name
      transformations: ""     # Filter/transform expression, e.g. "type = building"
      internal_name: ""       # Source internal ID pattern, e.g. "B$GC_BLDG"

# -----------------------------------------------------------------------------
# Attribute Mapping — target-first: IQGeo attribute ← source (populated by plan stage)
# Each entry maps one IQGeo target attribute to its source field + transformation.
# -----------------------------------------------------------------------------
attribute_mapping:
  - tracking:
      update_person: ""
      update_date: ""
      review_comments: ""
      status: ""              # One of status_values
    iqgeo_internal:
      iqgeo_version_tested: "" # e.g. "V13"
      jira_ticket: ""
    iqgeo_fields:
      table: ""               # Target IQGeo table, e.g. "building", "pole"
      table_type: ""          # "feature" | "spec" | "connection"
      display_name: ""
      internal_name: ""       # Target attribute internal name
      data_type: ""           # e.g. "string(64)", "integer", "double"
      default_value: ""
      pick_list: ""           # Pick list name if applicable
      visible: ""             # "Y" | "N"
      other: ""               # Additional notes
    source_mapping:
      system: ""              # Source system name
      table_layer: ""         # Source table
      attribute: ""           # Source attribute name
      transformations: ""     # e.g. "=source value", "LOOKUP(material)", "CONCAT(a,b)"
      internal_name: ""
      data_type: ""
      length: ""
      domain: ""              # Source domain/picklist name

# =============================================================================
# STRUCTURAL MODEL MAPPING
# =============================================================================
# The following sections capture how to transform a source model (often
# placement-based) into NMT's explicit containment/connectivity model.
# These are critical when source data does not store explicit relationships.

# -----------------------------------------------------------------------------
# Relationship Mapping — how NMT FK relationships are derived from source data
# Each entry maps one NMT relationship to its derivation method.
# -----------------------------------------------------------------------------
relationship_mapping:
  - tracking:
      update_person: ""
      update_date: ""
      review_comments: ""
      status: ""              # One of status_values
    target_relationship:
      child_object: ""        # NMT contained object, e.g. "equipment", "cable_segment"
      parent_object: ""       # NMT housing object, e.g. "structure", "route"
      fk_field: ""            # NMT FK field, e.g. "root_housing", "housing", "cable_ref"
      relationship_type: ""   # "containment" | "topology" | "ordering" | "connectivity"
    derivation:
      method: ""              # "foreign_key" | "spatial_proximity" | "spatial_intersection"
                              # | "naming_convention" | "segment_at_structures" | "synthetic"
      source_fk_field: ""     # Source FK field (if method = foreign_key)
      proximity_radius_m: 0   # Max distance (if method = spatial_proximity)
      snap_tolerance_m: 0     # Snap distance (if method = spatial_intersection)
      naming_pattern: ""      # Regex pattern (if method = naming_convention)
      parameters: ""          # Additional method-specific parameters (JSON or expression)
    fallback:
      method: ""              # Fallback derivation method if primary fails
      action_on_failure: ""   # "create_dqr_issue" | "assign_dummy" | "reject_record" | "leave_null"

# -----------------------------------------------------------------------------
# Containment Rules — define the target containment hierarchy for this migration
# Each entry is a parent→child type pair with inference configuration.
# -----------------------------------------------------------------------------
containment_rules:
  - tracking:
      update_person: ""
      update_date: ""
      review_comments: ""
      status: ""
    parent_type: ""           # NMT parent type, e.g. "structure", "route", "equipment"
    child_type: ""            # NMT child type, e.g. "equipment", "cable_segment", "conduit"
    inference_method: ""      # How to assign housing (references relationship_mapping method)
    geometry_inheritance: ""  # "inherit_from_parent" | "override_from_source" (NMT default: inherit)
    synthetic_generation:
      enabled: false          # Whether to auto-create parent objects when missing
      naming_template: ""     # e.g. "${prefix}structure_${seq}"
      default_type: ""        # e.g. "generic_structure", "splice_closure"
      conditions: ""          # When to create synthetic objects (expression)

# -----------------------------------------------------------------------------
# Topology Construction — how to build NMT topology from source data
# Defines cable segmentation, route derivation, and ordering rules.
# -----------------------------------------------------------------------------
topology_construction:
  route_derivation:
    method: ""                # "from_source_layer" | "from_cable_geometry" | "from_conduit_geometry" | "manual"
    source_layer: ""          # Source route/conduit layer (if from_source_layer)
    start_structure_field: "" # Source FK for start structure
    end_structure_field: ""   # Source FK for end structure
    deduplication: ""         # "merge_overlapping" | "keep_all" | "prefer_shortest"
    parameters: ""            # Additional config

  cable_segmentation:
    method: ""                # "segment_at_structures" | "from_source_segments" | "preserve_unsegmented"
    snap_tolerance_m: 0       # Distance to consider a structure "on" a cable path
    create_internal_segments: true   # Create internal segments at each structure crossing
    ordering_field: ""        # Source field for segment ordering (if from_source_segments)
    direction_field: ""       # Source field indicating cable direction
    forward_flag_rule: ""     # Rule to determine forward flag (e.g. "match_route_direction")
    parameters: ""

  conduit_assignment:
    method: ""                # "from_source_fk" | "spatial_containment" | "none"
    source_fk_field: ""       # Source FK linking cable to conduit
    continuous_chaining: false # Whether to build conduit chains across routes
    parameters: ""

  directionality:
    default_cable_direction: "" # "directed" | "undirected" (default for cables without explicit direction)
    direction_source_field: ""  # Source field indicating directed/undirected
    direction_value_map: ""     # Mapping of source values to "directed"/"undirected"
    parameters: ""

# -----------------------------------------------------------------------------
# Connectivity Mapping — how to build NMT connection records from source data
# Defines port assignment, strand mapping, and equipment function rules.
# -----------------------------------------------------------------------------
connectivity_mapping:
  connection_derivation:
    method: ""                # "from_connection_table" | "from_splice_records" | "from_circuit_data" | "none"
    source_table: ""          # Source connection/splice table
    from_object_field: ""     # Source field for "from" object reference
    from_port_field: ""       # Source field for "from" port/strand
    to_object_field: ""       # Source field for "to" object reference
    to_port_field: ""         # Source field for "to" port/strand
    side_determination: ""    # Rule to determine IN/OUT/A/Z side (e.g. "from_equipment_type")
    parameters: ""

  strand_mapping:
    numbering_scheme: ""      # "sequential" | "color_code" | "source_preserving"
    color_scheme: ""          # e.g. "TIA-598" (if using color codes)
    strand_count_field: ""    # Source field for fiber/strand count
    parameters: ""

  equipment_functions:
    - source_type: ""         # Source equipment type value
      nmt_function: ""        # NMT function: "pass_through" | "splitter" | "combiner" | "amplifier"
      port_config: ""         # e.g. "in:1,out:8" for a 1:8 splitter
      directionality: ""      # "directed" | "undirected"
      sample_value: ""        # Example value from source

# -----------------------------------------------------------------------------
# Value Mapping sheets — one section per coded domain (source value → target value)
# Add one attrval_<domain_name> key per domain that requires value translation.
# Populated by profile (source side) and plan (target side).
# -----------------------------------------------------------------------------
# attrval_<domain_name>:
#   source_attribute: ""    # Source attribute name, e.g. "Material"
#   target_attribute: ""    # Target attribute name, e.g. "pipematerial"
#   mappings:
#     - source_value: ""    # e.g. "(B)"
#       source_count: 0     # Count in source data
#       target_value: ""    # e.g. "bare steel"
#       target_description: "" # Human-readable label
